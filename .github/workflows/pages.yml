# web/ klasörünü GitHub Pages'te de yayınlar: https://oguzhan61-dilmac.github.io/360-vid2splat/
# Vercel adresine erişilemeyen ağlar için ikinci adres. Repo ayarlarında
# Settings > Pages > Source: "GitHub Actions" seçili olmalı.
name: Siteyi GitHub Pages'te yayınla

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
