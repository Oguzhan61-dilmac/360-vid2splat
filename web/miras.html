<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miras Gezgini · gez</title>
<meta name="description" content="Bir UNESCO Dünya Mirası'nı fotoğraf-gerçekçi 3D şehirde, sokak panoramalarında, hazır 3D modellerde ve 3D arazide gez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Bir mirasın tüm gezinti kaynaklarını tek sayfada toplar: Google 3D, sokak (Street View
   ve Commons 360° panoramaları), Sketchfab modelleri, 3D arazi ve kendi taramalarımız. */
:root {
  --void: #0b0e11;
  --panel: rgba(15, 19, 23, 0.86);
  --panel-solid: #141a1f;
  --line: rgba(190, 206, 220, 0.16);
  --fg: #e5e9ed;
  --muted: #8c97a3;
  --accent: #e8b84a;
  --accent-ink: #1b1505;
  --font-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--fg); font: 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
a { color: inherit; }
.label { font: 600 11px/1 var(--font-label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button, .btn {
  font: 500 14px/1 var(--font-ui); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; min-height: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none; white-space: nowrap;
}
button:hover, .btn:hover { border-color: rgba(232, 184, 74, 0.6); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

header {
  flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gr) 10px var(--gl);
  border-bottom: 1px solid var(--line); background: var(--panel-solid);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; flex: 1 1 240px; }
.mark { width: 28px; height: 28px; border: 2px solid var(--accent); border-radius: 50%; position: relative; flex: none; }
.mark::before, .mark::after { content: ""; position: absolute; background: var(--accent); }
.mark::before { left: 50%; top: 3px; bottom: 3px; width: 2px; transform: translateX(-50%); }
.mark::after { top: 50%; left: 3px; right: 3px; height: 2px; transform: translateY(-50%); }
.brand b { display: block; font: 600 17px/1.15 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > span { min-width: 0; }
.tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; min-height: 36px; padding: 8px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tabs button .n { font: 500 11px/1 var(--font-num); opacity: 0.8; }

main { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; }
.wrap { flex: 1; position: relative; min-height: 0; background: #000; }
.stage { position: absolute; inset: 0; background: #000; }
/* Turun, tuş rehberinin ve yürüme modunun katmanı: sahne yenilense de yerinde kalır */
.layer { position: absolute; inset: 0; pointer-events: none; }
.layer > * { pointer-events: auto; }
kbd { font: 500 11px/1 var(--font-num); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; color: var(--fg); background: rgba(255,255,255,0.04); }
.tour { position: absolute; left: 16px; bottom: 16px; width: min(440px, calc(100% - 32px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tour h3 { margin: 0; font: 600 19px/1.2 var(--font-ui); }
.tour p { margin: 0; font-size: 14px; color: #c9d0d7; max-height: 8.5em; overflow: auto; }
.tour .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tour .row button { min-height: 34px; padding: 7px 10px; }
.prog { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
.keyhint { position: absolute; right: 16px; top: 16px; width: min(300px, calc(100% - 32px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13.5px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.keyhint .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
.keyhint .keys span:nth-child(odd) { display: flex; gap: 3px; }
.keyhint small { color: var(--muted); }
.keyhint button { justify-self: start; min-height: 32px; padding: 6px 10px; }
.walkpad { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
.walkpad.locked { cursor: none; }
.walkpad .cross { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.75); pointer-events: none; }
.stick { position: absolute; left: 16px; bottom: 16px; width: 112px; height: 112px; border-radius: 50%; border: 1px solid var(--line); background: rgba(15,19,23,0.45); touch-action: none; display: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--accent); opacity: 0.85; }
@media (pointer: coarse) { .stick { display: block; } .hide-touch { display: none !important; } }
.svpad { position: absolute; right: 16px; bottom: 16px; display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px;
  padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.svpad button { min-height: 0; width: 44px; height: 44px; padding: 0; justify-content: center; font-size: 18px; }
.svpad .lbl { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.svpad .dir { display: grid; place-items: center; color: var(--accent); font-size: 18px; }
.tools button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.stage iframe, .stage .pano { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: center / cover no-repeat; }
.empty::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,14,17,0.55), rgba(11,14,17,0.88)); }
.empty .card { position: relative; width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; backdrop-filter: blur(6px); }
.empty h2 { margin: 0; font: 600 22px/1.2 var(--font-ui); text-wrap: balance; }
.empty p { margin: 0; color: #c9d0d7; }
.empty .row { display: flex; gap: 8px; flex-wrap: wrap; }
.spinner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; pointer-events: none; }

.bar { flex: none; display: flex; align-items: stretch; gap: 10px; padding: 10px var(--gr) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gl); background: var(--panel-solid); border-top: 1px solid var(--line); }
.strip { flex: 1; display: flex; gap: 8px; overflow-x: auto; min-width: 0; scrollbar-width: thin; }
.item { flex: none; width: 168px; display: grid; grid-template-rows: 84px auto; gap: 6px; padding: 0; border-radius: 10px; overflow: hidden; text-align: left; align-items: start; background: var(--panel); white-space: normal; }
.item img, .item .ph { width: 100%; height: 84px; object-fit: cover; display: block; background: #20262b; }
.item .ph { display: grid; place-items: center; color: var(--accent); font: 600 13px/1.2 var(--font-ui); padding: 8px; text-align: center; }
.item span { padding: 0 8px 8px; font-size: 12.5px; line-height: 1.25; color: #c9d0d7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.credit { flex: none; width: min(320px, 34vw); font-size: 12.5px; color: var(--muted); display: grid; align-content: center; gap: 4px; }
.credit a { color: var(--fg); }
.credit b { color: var(--fg); font-weight: 500; }
.tools { display: flex; gap: 6px; align-items: center; }
@media (max-width: 720px) {
  .bar { flex-wrap: wrap; }
  .credit { width: 100%; order: 2; }
  .item { width: 136px; grid-template-rows: 68px auto; }
  .item img, .item .ph { height: 68px; }
  .brand { flex-basis: 100%; }
  .tabs { width: 100%; }
}
.pnlm-container { background: #0b0e11; }
</style>
</head>
<body>
<header>
  <a class="brand" id="back" href="./">
    <span class="mark" aria-hidden="true"></span>
    <span><small id="meta">← Küre</small><b id="siteName">Miras Gezgini</b></span>
  </a>
  <div class="tabs" role="tablist" aria-label="Gezinti kaynağı" id="tabs"></div>
</header>
<main>
  <div class="wrap" id="wrap">
    <div class="stage" id="stage" role="tabpanel"><div class="spinner" id="spin">Yükleniyor…</div></div>
    <div class="layer" id="layer"></div>
  </div>
  <div class="bar" id="bar">
    <div class="credit" id="credit"></div>
    <div class="strip" id="strip" aria-label="Seçenekler"></div>
    <div class="tools">
      <span class="tools" id="tabTools"></span>
      <button type="button" id="fsBtn" title="Tam ekran">Tam ekran</button>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const commonsThumb = (file, w) => `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}?width=${w}`;

const S = { site: null, scans: [], models: [], pts: [], panos: null, cfg: {}, sv: null, tab: null, pano: null };
const TABS = [
  { id: "sokak", label: "Sokak 360°", title: "Google Street View ve 360° panoramalarla sokakta yürü" },
  { id: "modeller", label: "3D modeller", title: "Sketchfab'daki hazır 3D modeller" },
  { id: "google", label: "Google 3D", title: "Fotoğraf-gerçekçi 3D şehir: dron ya da yürüme" },
  { id: "earth", label: "Google Earth 3D", title: "Google Earth'te fotoğraf-gerçekçi 3D (yeni sekme)" },
  { id: "arazi", label: "3D arazi", title: "Uydu görüntüsü, arazi ve 3D binalar" },
  { id: "tarama", label: "Taramalarımız", title: "Kendi fotoğraf-gerçekçi taramalarımız" },
];

function available(id) {
  if (id === "google") return !!S.cfg.googleKey;
  if (id === "modeller") return S.models.length > 0;
  if (id === "tarama") return S.scans.length > 0;
  return true;
}

function renderTabs() {
  const box = $("tabs"); box.innerHTML = "";
  for (const t of TABS) {
    if (!available(t.id)) continue;
    const b = el("button", { type: "button", role: "tab", title: t.title }, t.label);
    if (t.id === "modeller") b.append(el("span", { className: "n" }, String(S.models.length)));
    b.setAttribute("aria-selected", String(S.tab === t.id));
    b.addEventListener("click", () => go(t.id));
    box.append(b);
  }
}

function clearStage() {
  stopTour(); exitWalk();
  if (S.pano) { try { S.pano.destroy(); } catch {} S.pano = null; }
  S.sk = null;
  $("stage").innerHTML = "";
  $("layer").innerHTML = "";
  $("strip").innerHTML = "";
  $("credit").innerHTML = "";
  $("tabTools").innerHTML = "";
}
function tool(label, title, onClick) {
  const b = el("button", { type: "button", title }, label);
  b.addEventListener("click", onClick);
  $("tabTools").append(b);
  return b;
}
function spinner(text = "Yükleniyor…") { $("stage").append(el("div", { className: "spinner" }, text)); }
function frame(src, title, allow = "fullscreen; xr-spatial-tracking; accelerometer; gyroscope; autoplay") {
  const f = el("iframe", { src, title, allow, allowFullscreen: true });
  f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
  $("stage").append(f);
  return f;
}
function emptyCard(title, text, ...actions) {
  const s = S.site;
  const box = el("div", { className: "empty" });
  if (s.img) box.style.backgroundImage = `url("${commonsThumb(s.img, 1280)}")`;
  box.append(el("div", { className: "card" }, el("h2", {}, title), el("p", {}, text), el("div", { className: "row" }, ...actions)));
  $("stage").append(box);
}
function extLink(href, text, primary) {
  return el("a", { className: primary ? "btn primary" : "btn", href, target: "_blank", rel: "noopener" }, text);
}
function card(img, text, onClick, current) {
  const b = el("button", { type: "button", className: "item" });
  if (img) b.append(el("img", { src: img, alt: "", loading: "lazy", decoding: "async" }));
  else b.append(el("div", { className: "ph" }, text.split(" · ")[0]));
  b.append(el("span", {}, text));
  b.setAttribute("aria-current", String(!!current));
  b.addEventListener("click", () => { for (const x of $("strip").children) x.setAttribute("aria-current", "false"); b.setAttribute("aria-current", "true"); onClick(); });
  return b;
}

// Pannellum (360° panorama görüntüleyici) yalnızca bir panorama açılınca yüklenir
let pannellumP = null;
function loadPannellum() {
  if (window.pannellum) return Promise.resolve();
  if (!pannellumP) {
    const css = document.createElement("link"); css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css"; document.head.append(css);
    pannellumP = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"; sc.onload = res; sc.onerror = rej; document.head.append(sc); });
  }
  return pannellumP;
}

// ---------- Ayak sesi (arazi.html ile aynı sentez) ----------
const audio = {
  ctx: null, noise: null, side: 1,
  init() {
    if (this.ctx) { this.ctx.resume?.(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    const len = Math.floor(this.ctx.sampleRate * 0.4);
    this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noise.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { last = 0.82 * last + 0.18 * (Math.random() * 2 - 1); d[i] = last * 3; }
  },
  step(k = 1) {
    const c = this.ctx; if (!c || c.state !== "running") return;
    const t = c.currentTime + 0.005; this.side = -this.side;
    const out = c.createGain(); out.gain.value = 0.5;
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = 0.18 * this.side; out.connect(p).connect(c.destination); } else out.connect(c.destination);
    const src = c.createBufferSource(); src.buffer = this.noise; src.playbackRate.value = 0.8 + Math.random() * 0.3;
    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 500 + Math.random() * 350; bp.Q.value = 0.8;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((0.4 + Math.random() * 0.1) * k, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.18);
    src.connect(bp).connect(g).connect(out); src.start(t, Math.random() * 0.15, 0.25);
  },
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- Rehberli tur: mirasın ünlü yapıları sırayla, Vikipedi'den kısa bilgiyle ----------
const STOP_S = 30;
const TOUR = { on: false, i: 0, left: 0, paused: false, timer: 0, pts: [], show: null };
async function wikiExtract(w) {
  if (!w) return "";
  const k = w.indexOf(":"), lang = w.slice(0, k), title = w.slice(k + 1);
  try {
    const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}`);
    if (!r.ok) return "";
    let t = (await r.json()).extract || "";
    if (t.length > 380) { const cut = t.lastIndexOf(". ", 380); t = cut > 140 ? t.slice(0, cut + 1) : t.slice(0, 380) + "…"; }
    return t;
  } catch { return ""; }
}
function stopTour() {
  TOUR.on = false; clearInterval(TOUR.timer);
  document.querySelector(".tour")?.remove();
  document.getElementById("tourBtn")?.classList.remove("on");
}
function startTour(pts, show) {
  stopTour();
  TOUR.on = true; TOUR.pts = pts; TOUR.show = show; TOUR.paused = false;
  const box = el("div", { className: "tour" });
  box.setAttribute("role", "region"); box.setAttribute("aria-label", "Rehberli tur");
  const step = el("div", { className: "label" }), name = el("h3"), text = el("p"), prog = el("i");
  const prev = el("button", { type: "button", title: "Önceki" }, "◀"), pause = el("button", { type: "button" }, "Duraklat"),
    next = el("button", { type: "button" }, "Sonraki ▶"), end = el("button", { type: "button" }, "Turu bitir");
  box.append(step, name, text, el("div", { className: "prog" }, prog), el("div", { className: "row" }, prev, pause, next, el("span", { style: "flex:1" }), end));
  $("layer").append(box);
  TOUR.ui = { step, name, text, prog, pause, next };
  prev.addEventListener("click", () => go2(TOUR.i - 1));
  next.addEventListener("click", () => go2(TOUR.i + 1));
  pause.addEventListener("click", () => { TOUR.paused = !TOUR.paused; pause.textContent = TOUR.paused ? "Devam et" : "Duraklat"; });
  end.addEventListener("click", stopTour);
  document.getElementById("tourBtn")?.classList.add("on");
  function go2(i) {
    const u = TOUR.ui;
    if (i >= TOUR.pts.length) {
      TOUR.paused = true; u.pause.hidden = true; u.next.hidden = true;
      u.step.textContent = "Tur bitti"; u.name.textContent = S.site.tr; u.prog.style.width = "100%";
      u.text.textContent = "Bütün noktaları gezdin. Şeritten istediğin yere dönebilir, 3D modellere ya da Google Earth 3D'ye geçebilirsin.";
      return;
    }
    i = Math.max(0, i);
    TOUR.i = i; TOUR.left = STOP_S; u.pause.hidden = false; u.next.hidden = false;
    const pt = TOUR.pts[i];
    TOUR.show(pt, i);
    u.step.textContent = `Rehberli tur · ${i + 1} / ${TOUR.pts.length}`;
    u.name.textContent = pt[2];
    u.text.textContent = "Bilgi yükleniyor…";
    u.prog.style.width = "0%";
    wikiExtract(pt[3]).then((t) => { if (TOUR.on && TOUR.i === i) u.text.textContent = t || "Görüntüyü sürükleyerek etrafına bak; yerdeki oklarla yürüyebilirsin."; });
  }
  go2(0);
  TOUR.timer = setInterval(() => {
    if (!TOUR.on || TOUR.paused) return;
    TOUR.left -= 0.25;
    TOUR.ui.prog.style.width = `${Math.min(100, 100 * (1 - TOUR.left / STOP_S))}%`;
    if (TOUR.left <= 0) go2(TOUR.i + 1);
  }, 250);
}

// ---------- Street View'da klavyeyle yürüme ----------
// Street View Google'ın çerçevesinde çalışır; tuşları ancak çerçeve odaktayken alır (↑ ↓ ← →).
function keyWalk() {
  const f = $("stage").querySelector("iframe");
  $("wrap").requestFullscreen?.().catch(() => {});
  const focus = () => { try { f?.focus(); f?.contentWindow?.focus(); } catch {} };
  setTimeout(focus, 350); setTimeout(focus, 1200);
  document.querySelector(".keyhint")?.remove();
  const close = el("button", { type: "button" }, "Tamam");
  const keys = el("div", { className: "keys" });
  // Google'ın gömülü Street View kısayolları: oklar bakışı çevirir; ilerlemek için yere tıklanır
  for (const [k, t] of [[["Tık"], "yerdeki oka ya da gitmek istediğin yere tıkla: oraya yürürsün"], [["←", "→"], "sola / sağa bak"], [["↑", "↓"], "yukarı / aşağı bak"], [["+", "−"], "yakınlaş / uzaklaş"]]) {
    keys.append(el("span", {}, ...k.map((x) => el("kbd", {}, x))), el("span", {}, t));
  }
  const box = el("div", { className: "keyhint" }, el("b", {}, "Street View'da gezinme"), keys,
    el("small", {}, "Tuşlar için önce görüntüye bir kez tıkla. Bazı noktalar tek bir 360° fotoğraftır, okları yoktur: oralarda sağ alttaki adım düğmeleriyle (ya da sayfadayken W A S D ile) 20 m'lik adımlarla yürü."), close);
  close.addEventListener("click", () => { box.remove(); focus(); });
  $("layer").append(box);
}

// ---------- 3D modellerde oyun gibi yürüme: Sketchfab Viewer API ile kamerayı biz sürüyoruz ----------
const SK_VER = "1.12.1";
function loadSketchfabApi() {
  if (window.Sketchfab) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = `https://static.sketchfab.com/api/sketchfab-viewer-${SK_VER}.js`;
    sc.onload = res; sc.onerror = rej; document.head.append(sc);
  });
}
const W = { on: false, pos: [0, 0, 0], yaw: 0, pitch: 0, scale: 1, vel: [0, 0], phase: 0, amp: 0, stepN: 0, keys: new Set(), stick: { x: 0, y: 0 }, last: 0, sent: 0, raf: 0, pad: null };
function walkKey(e, down) {
  if (!W.on) return;
  if (/^(Key[WASDQE]|Arrow|Shift|Space)/.test(e.code)) e.preventDefault();
  if (down) { W.keys.add(e.code); if (e.code === "Escape") exitWalk(); } else W.keys.delete(e.code);
}
addEventListener("keydown", (e) => walkKey(e, true));
addEventListener("keyup", (e) => walkKey(e, false));
addEventListener("blur", () => W.keys.clear());
function enterWalk() {
  const api = S.sk;
  if (!api || W.on) return;
  stopTour();
  api.getCameraLookAt((err, cam) => {
    if (err || !cam) return;
    const p = cam.position, t = cam.target;
    const d = [t[0] - p[0], t[1] - p[1], t[2] - p[2]];
    const L = Math.hypot(...d) || 1;
    // Sketchfab sahnesi Z-yukarı: yön açıları XY düzleminde
    W.pos = p.slice(); W.scale = L; W.yaw = Math.atan2(d[0], d[1]); W.pitch = Math.asin(Math.max(-1, Math.min(1, d[2] / L)));
    W.vel = [0, 0]; W.on = true; W.last = performance.now();
    audio.init();
    const pad = el("div", { className: "walkpad" }, el("div", { className: "cross" }));
    const stick = el("div", { className: "stick" }, el("i"));
    const hint = el("div", { className: "keyhint" });
    const keys = el("div", { className: "keys" });
    for (const [k, txt] of [[["W", "A", "S", "D"], "yürü"], [["Fare"], "etrafına bak"], [["Shift"], "koş"], [["E", "Q"], "yüksel / alçal"], [["Esc"], "yürümeyi bitir"]]) {
      keys.append(el("span", {}, ...k.map((x) => el("kbd", {}, x))), el("span", {}, txt));
    }
    const done = el("button", { type: "button" }, "Yürümeyi bitir");
    done.addEventListener("click", exitWalk);
    hint.append(el("b", {}, "Yürüyerek gez"), keys, el("small", {}, "Görüntüye tıklayınca fare kilitlenir. Modelin dışından başlarsın; içine doğru yürü."), done);
    $("layer").append(pad, stick, hint);
    W.pad = pad;
    pad.addEventListener("click", () => { if (!matchMedia("(pointer: coarse)").matches) pad.requestPointerLock?.()?.catch?.(() => {}); });
    let drag = null;
    pad.addEventListener("pointerdown", (e) => { if (document.pointerLockElement !== pad) drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
    pad.addEventListener("pointermove", (e) => { if (drag && e.pointerId === drag.id) { lookBy((e.clientX - drag.x) * 1.6, (e.clientY - drag.y) * 1.6); drag.x = e.clientX; drag.y = e.clientY; } });
    pad.addEventListener("pointerup", () => (drag = null));
    const knob = stick.querySelector("i"); let sid = null;
    const sm = (e) => { const r = stick.getBoundingClientRect(), R = r.width / 2; let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R; const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; } W.stick = { x, y }; knob.style.transform = `translate(${x * R * 0.6}px, ${y * R * 0.6}px)`; };
    stick.addEventListener("pointerdown", (e) => { e.stopPropagation(); sid = e.pointerId; stick.setPointerCapture(e.pointerId); sm(e); });
    stick.addEventListener("pointermove", (e) => { if (e.pointerId === sid) sm(e); });
    stick.addEventListener("pointerup", () => { sid = null; W.stick = { x: 0, y: 0 }; knob.style.transform = ""; });

  });
}
function lookBy(dx, dy) { W.yaw += dx * 0.0022; W.pitch = Math.max(-1.45, Math.min(1.45, W.pitch - dy * 0.0022)); }
document.addEventListener("mousemove", (e) => { if (W.on && document.pointerLockElement === W.pad) lookBy(e.movementX, e.movementY); });
function exitWalk() {
  if (!W.on) return;
  W.on = false; cancelAnimationFrame(W.raf); W.keys.clear();
  if (document.pointerLockElement) document.exitPointerLock?.();
  for (const sel of [".walkpad", ".stick", ".keyhint"]) document.querySelector(sel)?.remove();
  document.getElementById("walkBtn")?.classList.remove("on");
}
function walkFrame(now) {
  if (!W.on) return;
  W.raf = requestAnimationFrame(walkFrame);
  const dt = Math.min(0.05, (now - W.last) / 1000); W.last = now;
  const k = W.keys;
  let fwd = (k.has("KeyW") || k.has("ArrowUp") ? 1 : 0) - (k.has("KeyS") || k.has("ArrowDown") ? 1 : 0) - W.stick.y;
  let side = (k.has("KeyD") || k.has("ArrowRight") ? 1 : 0) - (k.has("KeyA") || k.has("ArrowLeft") ? 1 : 0) + W.stick.x;
  const mag = Math.hypot(fwd, side); if (mag > 1) { fwd /= mag; side /= mag; }
  const speed = W.scale * (k.has("ShiftLeft") || k.has("ShiftRight") ? 0.36 : 0.12);
  const sy = Math.sin(W.yaw), cy = Math.cos(W.yaw);
  const tx = (sy * fwd + cy * side) * speed, ty = (cy * fwd - sy * side) * speed;
  const a = 1 - Math.exp(-dt * (tx || ty ? 7 : 9));
  W.vel[0] += (tx - W.vel[0]) * a; W.vel[1] += (ty - W.vel[1]) * a;
  W.pos[0] += W.vel[0] * dt; W.pos[1] += W.vel[1] * dt;
  const up = (k.has("KeyE") || k.has("Space") ? 1 : 0) - (k.has("KeyQ") || k.has("KeyC") ? 1 : 0);
  W.pos[2] += up * W.scale * 0.25 * dt;
  // baş sallantısı ve ayak sesi
  const d = Math.hypot(W.vel[0], W.vel[1]) * dt, sp = d / Math.max(dt, 1e-4), base = W.scale * 0.12;
  W.amp += (Math.min(1.5, sp / base) - W.amp) * Math.min(1, dt * 5);
  if (d > 0) {
    W.phase += (d / (base * 0.5)) * Math.PI;
    const n = Math.floor(W.phase / Math.PI);
    if (n !== W.stepN) { W.stepN = n; if (sp > base * 0.2) audio.step(Math.min(1.3, 0.55 + 0.4 * sp / base)); }
  }
  const bob = reduced ? 0 : Math.abs(Math.sin(W.phase)) * W.amp * W.scale * 0.006;
  if (now - W.sent < 33) return;   // kamerayı saniyede ~30 kez güncelle
  W.sent = now;
  const cp = Math.cos(W.pitch);
  const eye = [W.pos[0], W.pos[1], W.pos[2] + bob];
  const R = W.scale * 0.5;
  const target = [eye[0] + sy * cp * R, eye[1] + cy * cp * R, eye[2] + Math.sin(W.pitch) * R];
  try { S.sk?.setCameraLookAt(eye, target, 0); } catch {}
}

async function findPanos() {
  if (S.panos) return S.panos;
  const s = S.site;
  const q = `hastemplate:Pano360 nearcoord:6km,${s.lat},${s.lon}`;
  const u = `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=24&gsrsearch=${encodeURIComponent(q)}&prop=imageinfo&iiprop=size|url|extmetadata&iiextmetadatafilter=Artist|LicenseShortName&iiurlwidth=4096`;
  try {
    const j = await (await fetch(u)).json();
    const pages = Object.values(j.query?.pages || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
    S.panos = pages.map((p) => {
      const ii = p.imageinfo?.[0] || {};
      const md = ii.extmetadata || {};
      const strip = (h) => (h || "").replace(/<[^>]+>/g, "").trim();
      return { title: p.title.replace(/^File:/, "").replace(/\.[a-z]+$/i, ""), src: ii.thumburl || ii.url, page: ii.descriptionurl,
        thumb: (ii.thumburl || "").replace(/\/\d+px-/, "/330px-"), artist: strip(md.Artist?.value), lic: strip(md.LicenseShortName?.value), w: ii.width };
    }).filter((p) => p.src && p.w >= 2000);

  return S.panos;
}

// Street View: anahtarla (Maps Embed API) ya da anahtarsız gömme biçimiyle. Commons 360°
// panoramaları arka planda yüklenip şeride eklenir, Street View'ı bekletmez.
// Bakış noktası yola/patikaya kaydırılmışsa (scripts/snap_viewpoints.py) oradan, yapıya dönük açılır:
// Google'ın yol boyunca çekilmiş okları olan görüntüsüne denk gelme olasılığı artar.
function svStart(pt) {
  const sn = pt?.[4];

function svUrl(lat, lon, head) {

function svEmbedUrl(pt) {

  if (key && v && !pt) return `https://www.google.com/maps/embed/v1/streetview?key=${encodeURIComponent(key)}&pano=${v[2]}&heading=${v[3]}&pitch=0&fov=90&language=tr`;
  const st = svStart(pt);

}
// Okları olmayan (tek 360° fotoğraf) noktalarda da ilerleyebilmek için: adım adım yürüme
const SV = { lat: 0, lon: 0, head: 0, frame: null };
function svMove(dist, turn = 0) {
  SV.head = (SV.head + turn + 360) % 360;
  if (dist) {
    const b = SV.head * Math.PI / 180;
    SV.lat += dist * Math.cos(b) / 111320;
    SV.lon += dist * Math.sin(b) / (111320 * Math.cos(SV.lat * Math.PI / 180));
  }
  if (SV.frame?.isConnected) SV.frame.src = svUrl(SV.lat, SV.lon, SV.head);
  const d = document.querySelector(".svpad .dir");
  if (d) d.style.transform = `rotate(${SV.head - 90}deg)`;
}
function svPad() {
  document.querySelector(".svpad")?.remove();
  const b = (txt, title, fn) => { const x = el("button", { type: "button", title }, txt); x.addEventListener("click", fn); return x; };
  const pad = el("div", { className: "svpad" },
    b("⟲", "Sola dön (A)", () => svMove(0, -45)), b("↑", "İleri yürü, 20 m (W)", () => svMove(20)), b("⟳", "Sağa dön (D)", () => svMove(0, 45)),
    el("span", { className: "dir", title: "Yürüme yönü" }, "➤"), b("↓", "Geri, 20 m (S)", () => svMove(-20)), el("span"),
    el("div", { className: "lbl" }, "Ok yoksa buradan yürü"));
  pad.querySelector(".dir").style.transform = `rotate(${SV.head - 90}deg)`;
  $("layer").append(pad);
}

// Google Earth: fotoğraf-gerçekçi 3D şehir. Başka sitelere gömülemiyor, yeni sekmede açılır.
async function groundElevation(lat, lon) {
  const z = 11, n = 2 ** z, R = Math.PI / 180;
  const xt = ((lon + 180) / 360) * n;
  const yt = ((1 - Math.log(Math.tan(lat * R) + 1 / Math.cos(lat * R)) / Math.PI) / 2) * n;
  const img = new Image(); img.crossOrigin = "anonymous";
  img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${Math.floor(xt)}/${Math.floor(yt)}.png`;
  await img.decode();
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0);
  const [r, gg, b] = g.getImageData(Math.floor((xt % 1) * 256), Math.floor((yt % 1) * 256), 1, 1).data;
  return Math.max(0, Math.round(r * 256 + gg + b / 256 - 32768));
}
function earthUrls(elev) {

    maps: `https://www.google.com/maps/@${s.lat},${s.lon},${elev + Math.round(dist * 0.6)}a,35y,0h,${tilt}t/data=!3m1!1e3`,
  };
}

  // Tek küçük dosya (data/miras/<no>.json): miras bilgisi, taramalar, Sketchfab modelleri, Street View panosu
  const [doc, cfg] = await Promise.all([json(`data/miras/${id}.json`, null), json("data/config.json", {})]);
  if (!doc) { $("stage").innerHTML = ""; $("stage").append(el("div", { className: "spinner" }, "Miras bulunamadı. Küreye dönüp bir miras seç.")); return; }
  const s = doc.site;
  S.site = s; S.cfg = cfg || {};
  // svChecked: Street View taraması yapıldı mı (yapılmadıysa "yakında görüntü yok" denmez)
  S.sv = doc.svChecked ? (doc.sv ? { [s.id]: doc.sv } : {}) : null;
  S.scans = doc.scans || [];
  S.models = doc.models || [];
  S.pts = doc.pts || [];
  document.title = `${s.tr} · Miras Gezgini`;
  $("siteName").textContent = s.tr;
  $("meta").textContent = `← Küre · UNESCO ${s.id}${s.y ? ` · ${s.y}` : ""} · ${s.c.join(", ")}`;
  $("back").href = `./#miras-${s.id}`;
  go(tab && available(tab) ? tab : firstTab(), true);
}
addEventListener("popstate", () => {
  const [idStr, tab] = location.hash.replace(/^#/, "").split("/");
  if (S.site && Number(idStr) === S.site.id) { if (tab && tab !== S.tab) go(tab, true); }
  else location.reload();
});
boot().catch((e) => { console.error(e); $("stage").innerHTML = ""; $("stage").append(el("div", { className: "spinner" }, "Yüklenemedi. Sayfayı yenile.")); });
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
